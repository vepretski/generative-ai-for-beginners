<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafaf9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Orange to Blue Gradient Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#brandGrad)"/>
  
  <!-- Main Text -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#1c1917" text-anchor="middle">7YA.IO x STARTON</text>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="45" font-weight="400" fill="#57534e" text-anchor="middle">מסלול המראה לנוער בסיכון</text>
  
  <!-- Stats -->
  <rect x="200" y="380" width="280" height="150" rx="20" fill="#fff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="340" y="440" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#ea580c" text-anchor="middle">310M+</text>
  <text x="340" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#78716c" text-anchor="middle">REACH</text>
  
  <rect x="720" y="380" width="280" height="150" rx="20" fill="#fff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="860" y="440" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#3b82f6" text-anchor="middle">7YA.IO</text>
  <text x="860" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#78716c" text-anchor="middle">FORCE</text>
</svg>
